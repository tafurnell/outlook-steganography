# Include inside the WordPress `server { ... }` block (above the PHP location),
# e.g.  include /etc/nginx/snippets/outlook-stego.conf;
# Files are deployed to /var/www/outlook-stego/ (adjust `alias` to match).
# See docs/design-and-decisions.md (D-016, D-019).

location ^~ /outlook-stego/ {
    alias /var/www/outlook-stego/;
    try_files $uri =404;

    # Content-hashed build output (e.g. taskpane.715e7329.js, stego_wasm_bg.21ba13f4.wasm): cache forever.
    # Quoted because the regex contains { } (unquoted, nginx fails to parse it).
    location ~* "\.[0-9a-f]{8}\.(js|wasm)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Entry pages + manifest: always revalidate so deploys take effect.
    location ~* \.(html|xml)$ {
        add_header Cache-Control "no-cache";
    }
    # Everything else (css, icons): short cache.
    location ~* \.(css|png)$ {
        add_header Cache-Control "public, max-age=3600";
    }
    # NB: add_header here replaces any server-level headers such as
    # X-Frame-Options, which must NOT be sent – Outlook iframes the task pane.
}
